<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Unifio CSA — Homologação</title>
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      min-height: 100vh;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at top left, rgba(47,168,118,0.28), transparent 35%),
        radial-gradient(circle at bottom right, rgba(31,122,82,0.2), transparent 35%),
        linear-gradient(135deg, #06140d 0%, #123524 45%, #1f7a52 100%);
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      overflow-x: hidden;
      position: relative;
    }
    body::before, body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      filter: blur(20px);
      opacity: 0.22;
      pointer-events: none;
    }
    body::before {
      width: 420px;
      height: 420px;
      background: #2fa876;
      top: -120px;
      left: -120px;
    }
    body::after {
      width: 320px;
      height: 320px;
      background: #7fe0b8;
      bottom: -100px;
      right: -100px;
    }

    .stage {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(30px, 5vw, 90px);
      width: 100%;
      max-width: 1200px;
      z-index: 2;
    }

    .left {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 26px;
    }
    .logo {
      max-width: 240px;
      width: 46vw;
      filter: drop-shadow(0 8px 24px rgba(0,0,0,0.35));
    }
    .tag-csa {
      font-size: .85rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #9fe3c4;
      margin-top: -14px;
    }
    .selo {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.16);
      color: #fff;
      padding: 10px 18px;
      border-radius: 999px;
      backdrop-filter: blur(10px);
      font-size: .78rem;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .selo .ponto {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #00d26a;
      animation: pulse 2s infinite;
    }

    /* Telefone */
    .phone-wrap {
      animation: floatY 4s ease-in-out infinite;
      filter: drop-shadow(0 24px 60px rgba(0,0,0,.35));
    }
    .phone {
      width: clamp(260px, 24vw, 320px);
      height: clamp(500px, 70vh, 620px);
      background: #0f1f18;
      border-radius: 42px;
      padding: 14px;
      border: 1px solid rgba(255,255,255,.1);
      position: relative;
      overflow: hidden;
    }
    .phone::before {
      content: '';
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 110px;
      height: 26px;
      background: #050f0a;
      border-radius: 20px;
      z-index: 10;
    }
    .screen {
      width: 100%;
      height: 100%;
      border-radius: 34px;
      background: linear-gradient(180deg, #eefbf3 0%, #d9f3e3 100%);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .chat-header {
      background: linear-gradient(135deg, #1f7a52 0%, #123524 100%);
      padding: 22px 20px 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      color: #fff;
    }
    .bot-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(255,255,255,.15);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      flex-shrink: 0;
    }
    .chat-title { font-size: 1rem; font-weight: 700; }
    .chat-status { font-size: .75rem; opacity: .8; margin-top: 2px; }

    .messages {
      flex: 1;
      padding: 22px 18px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .bubble {
      max-width: 78%;
      padding: 14px 16px;
      border-radius: 18px;
      font-size: .88rem;
      line-height: 1.5;
      animation: bubbleIn .4s ease both;
    }
    .received {
      background: #fff;
      color: #17331f;
      border-bottom-left-radius: 6px;
    }
    .sent {
      background: #1f7a52;
      color: #fff;
      align-self: flex-end;
      border-bottom-right-radius: 6px;
    }
    .bubble:nth-child(1) { animation-delay: .1s; }
    .bubble:nth-child(2) { animation-delay: .5s; }
    .bubble:nth-child(3) { animation-delay: .9s; }
    .typing {
      width: 78px;
      height: 40px;
      background: #fff;
      border-radius: 18px;
      border-bottom-left-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      animation: bubbleIn .4s ease both;
      animation-delay: 1.3s;
    }
    .typing span {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #7ad99f;
      animation: blink 1.4s infinite;
    }
    .typing span:nth-child(2) { animation-delay: .2s; }
    .typing span:nth-child(3) { animation-delay: .4s; }

    @keyframes floatY {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: .5; transform: scale(.85); }
    }
    @keyframes bubbleIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes blink {
      0%, 100% { opacity: .3; }
      50% { opacity: 1; }
    }

    @media (max-width: 860px) {
      body { padding: 0; }
      .stage { flex-direction: column; gap: 0; text-align: center; max-width: 100%; }
      .left {
        align-items: center;
        justify-content: center;
        width: 100%;
        min-height: 100svh;
        padding: 40px 20px;
      }
      .phone-wrap { margin-bottom: 40px; }
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="left">
      <img class="logo" src="img/unifio-logo-azul.png" alt="Unifio" />
      <div class="tag-csa">Colégio Santo Antônio</div>
      <span class="selo"><span class="ponto"></span> Ambiente de Homologação</span>
    </div>

    <div class="phone-wrap">
      <div class="phone">
        <div class="screen">
          <div class="chat-header">
            <div class="bot-avatar">🎒</div>
            <div>
              <div class="chat-title">Assistente CSA</div>
              <div class="chat-status">Online agora</div>
            </div>
          </div>
          <div class="messages">
            <div class="bubble received">Olá! 👋<br>Sou o assistente virtual do Colégio Santo Antônio. Como posso te ajudar?</div>
            <div class="bubble sent">Quero a 2ª via do boleto do meu filho</div>
            <div class="bubble received">Claro! Só um instante que já localizo a fatura 🎒</div>
            <div class="typing"><span></span><span></span><span></span></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="text/javascript" src="https://cronchatv1.lyceum.com.br/unifio-csa-homolog/img/bot.js"></script>
</body>
</html>
